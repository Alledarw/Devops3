name: Build and Push Docker Image to GHCR

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build Docker image
      run: |
        docker build --no-cache -t ghcr.io/alledarw/devops3/web-server-nginx:latest .
        # The repository name starts with an uppercase letter, which is not allowed in Docker image tags.
        # Therefore, we need to manually specify the repository path in lowercase rather than using 
        # `${{ github.repository }}`, which may include uppercase letters.

    - name: Push Docker image to GHCR
      run: |
        docker push ghcr.io/alledarw/devops3/web-server-nginx:latest
